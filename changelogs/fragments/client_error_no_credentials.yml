---
security_fixes:
  - client - do not include the request body and headers in the ``debug_info`` of communication errors by default.
    They carried the OAuth token request form data (URL encoded password, client secret and refresh token),
    bearer tokens and ``instance.custom_headers`` values, which were printed in the task result
    when the instance could not be reached or the TLS certificate check failed.
    Set ``instance.include_sensitive_headers`` (or ``SN_INCLUDE_SENSITIVE_HEADERS``) to ``true``
    to opt in when debugging connectivity issues.
